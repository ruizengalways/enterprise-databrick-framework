[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-databricks-framework"
version = "0.1.0"
description = "Production-grade metadata-driven Databricks lakehouse framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
  "wheel>=0.44,<1",
]

[project.scripts]
edp = "edp_framework.cli:main"
bootstrap_control = "edp_framework.databricks_tasks.bootstrap_control:main"

[project.entry-points."edp.patterns"]
# External packages register providers here. Example:
# custom_sap = "company_sap_patterns.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["edp_framework"]
