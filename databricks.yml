bundle:
  name: enterprise-databricks-framework
  engine: direct

databricks_cli_version: '>= 1.3.0'

include:
  - resources/*.yml
  - resources/**/*.yml

artifacts:
  framework_wheel:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
    dynamic_version: true

variables:
  catalog:
    description: Environment catalog managed by Terraform/platform automation.

  runtime_service_principal:
    description: Application ID of the service principal used to run shared CI/CD workloads.

  operator_group:
    description: Databricks group allowed to manage shared environment workload resources.

  ci_namespace:
    description: Unique PR/CI deployment namespace.
    default: manual

sync:
  include:
    - src/**
    - config/**
    - sql/**

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: edp_dev
    run_as:
      user_name: ${workspace.current_user.userName}
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}

  ci:
    mode: development
    variables:
      catalog: edp_ci
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/${var.ci_namespace}
    presets:
      name_prefix: '[${var.ci_namespace}] '
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1
      tags:
        environment: ci
        ci_namespace: ${var.ci_namespace}
    run_as:
      service_principal_name: ${var.runtime_service_principal}
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.operator_group}
      - level: CAN_RUN
        service_principal_name: ${var.runtime_service_principal}

  shared_dev:
    mode: production
    variables:
      catalog: edp_dev
    workspace:
      root_path: /Workspace/Platform/.bundle/${bundle.name}/${bundle.target}
    presets:
      tags:
        environment: dev
    run_as:
      service_principal_name: ${var.runtime_service_principal}
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.operator_group}
      - level: CAN_RUN
        service_principal_name: ${var.runtime_service_principal}

  uat:
    mode: production
    variables:
      catalog: edp_uat
    workspace:
      root_path: /Workspace/Platform/.bundle/${bundle.name}/${bundle.target}
    presets:
      tags:
        environment: uat
    run_as:
      service_principal_name: ${var.runtime_service_principal}
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.operator_group}
      - level: CAN_RUN
        service_principal_name: ${var.runtime_service_principal}

  prod:
    mode: production
    variables:
      catalog: edp_prod
    workspace:
      root_path: /Workspace/Platform/.bundle/${bundle.name}/${bundle.target}
    presets:
      tags:
        environment: prod
    run_as:
      service_principal_name: ${var.runtime_service_principal}
    permissions:
      - level: CAN_MANAGE
        group_name: ${var.operator_group}
      - level: CAN_RUN
        service_principal_name: ${var.runtime_service_principal}
