name: Deploy shared DEV

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-shared-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DATABRICKS_HOST != '' && vars.DATABRICKS_CLIENT_ID != '' && vars.DATABRICKS_RUNTIME_CLIENT_ID != '' && vars.DATABRICKS_OPERATOR_GROUP != '' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_runtime_service_principal: ${{ vars.DATABRICKS_RUNTIME_CLIENT_ID }}
      BUNDLE_VAR_operator_group: ${{ vars.DATABRICKS_OPERATOR_GROUP }}
    steps:
      - name: Checkout exact merge SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Revalidate source
        run: |
          pip install -e '.[dev]'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          edp validate config/tables
          ruff check .
          mypy src/edp_framework
          pytest
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate and plan
        run: |
          databricks bundle validate -t shared_dev
          databricks bundle plan -t shared_dev
      - name: Deploy exact SHA
        run: databricks bundle deploy -t shared_dev
      - name: Smoke and record release
        run: >-
          databricks bundle run -t shared_dev
          --params git_sha=${GITHUB_SHA},workflow_run_id=${GITHUB_RUN_ID},deployed_by=${GITHUB_ACTOR},source_repository=${GITHUB_REPOSITORY}
          release_gate
