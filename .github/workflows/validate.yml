name: Validate framework package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Enforce package-only repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e databricks.yml
          test ! -d platform
          test ! -d resources
          test ! -d config/environments
      - name: Enforce human-machine documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          if find docs -type f ! -name '*.md' -print -quit | grep -q .; then
            echo 'docs/ is human-readable Markdown only' >&2
            exit 1
          fi
          if find project -type f ! \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) -print -quit | grep -q .; then
            echo 'project/ is machine-readable YAML/JSON only' >&2
            exit 1
          fi
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate example metadata
        run: edp validate examples/table_specs
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/edp_framework
      - name: Tests
        run: pytest --cov=edp_framework --cov-report=term-missing
      - name: Build reusable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
