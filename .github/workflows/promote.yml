name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact full commit SHA previously validated and deployed to shared DEV
        required: true
        type: string
      target:
        description: Deployment target
        required: true
        type: choice
        options: [uat, prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_runtime_service_principal: ${{ vars.DATABRICKS_RUNTIME_CLIENT_ID }}
      BUNDLE_VAR_operator_group: ${{ vars.DATABRICKS_OPERATOR_GROUP }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Revalidate exact release
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
          pip install -e '.[dev]'
          edp validate config/tables
          ruff check .
          mypy src/edp_framework
          pytest
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate and plan bundle
        run: |
          databricks bundle validate -t "${{ inputs.target }}"
          databricks bundle plan -t "${{ inputs.target }}"
      - name: Deploy exact release
        run: databricks bundle deploy -t "${{ inputs.target }}"
      - name: Smoke and record deployment evidence
        run: >-
          databricks bundle run -t "${{ inputs.target }}"
          --params git_sha=${{ inputs.release_sha }},workflow_run_id=${GITHUB_RUN_ID},deployed_by=${GITHUB_ACTOR},source_repository=${GITHUB_REPOSITORY}
          release_gate
