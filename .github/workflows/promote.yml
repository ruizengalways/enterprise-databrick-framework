name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact commit SHA previously validated
        required: true
        type: string
      target:
        description: Deployment target
        required: true
        type: choice
        options: [uat, prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: databricks-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install framework tests
        run: pip install -e '.[dev]'
      - name: Revalidate release
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
          edp validate config/tables
          pytest
      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.10.0
      - name: Validate bundle
        run: databricks bundle validate -t "${{ inputs.target }}"
      - name: Deploy exact release
        run: databricks bundle deploy -t "${{ inputs.target }}"
      - name: Record deployment evidence
        run: |
          echo "Release history write is enabled in Phase 2 after control schema bootstrap."
