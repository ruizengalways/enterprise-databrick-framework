[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-pattern-extension"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["enterprise-databricks-framework>=0.1,<1"]

[project.entry-points."edp.patterns"]
company_pattern = "company_pattern_extension.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
